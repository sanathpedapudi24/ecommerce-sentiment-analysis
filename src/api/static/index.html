<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Sentiment</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5f6878; --border: #dde1e7;
    --accent: #2f5bea; --negative: #d32f2f; --neutral: #757575; --positive: #2e7d32;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --text: #e7eaf0; --muted: #9aa3b2; --border: #2c323d;
      --accent: #7b9bff; --negative: #ef6b6b; --neutral: #a3a3a3; --positive: #5cbf63;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.5rem; margin: 0; }
  .badge { font-size: .8rem; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 20px; }
  textarea { width: 100%; min-height: 120px; margin-top: 8px; padding: 12px; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; resize: vertical; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  button { font: inherit; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .primary { background: var(--accent); color: #fff; border: 0; padding: 8px 18px; font-weight: 600; }
  .chip { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 4px 12px; font-size: .85rem; }
  .hint { color: var(--muted); font-size: .85rem; }
  .result { border-top: 1px solid var(--border); padding: 14px 0; }
  .result:first-child { border-top: 0; padding-top: 0; }
  .result:last-child { padding-bottom: 0; }
  .label { font-weight: 700; text-transform: capitalize; }
  .label + .hint { margin-left: 8px; }
  .text { color: var(--muted); margin: 2px 0 10px; overflow-wrap: anywhere; }
  .bar { display: grid; grid-template-columns: 70px 1fr 52px; gap: 8px; align-items: center; font-size: .85rem; }
  .track { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; border-radius: 4px; }
  .error { color: var(--negative); margin: 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Review Sentiment</h1>
    <span class="badge" id="model">connecting…</span>
  </header>

  <section class="card">
    <label for="reviews" class="hint">Paste a customer review. Put several on separate lines to score them as one batch (up to 100). Ctrl+Enter to analyze.</label>
    <textarea id="reviews"></textarea>
    <div class="row">
      <button class="primary" id="analyze">Analyze</button>
      <span class="hint">Try:</span>
      <button class="chip" data-text="The dress fits beautifully and the silk fabric is breathtaking!">Positive</button>
      <button class="chip" data-text="It's okay. Runs a little small and the color is duller than pictured.">Mixed</button>
      <button class="chip" data-text="Terrible quality, the seams ripped after one wash. Returning it.">Negative</button>
      <button class="chip" data-text="Love it, wearing it every weekend!&#10;Runs slightly small, size up.&#10;I didn't like the fabric at all and it doesn't fit.">Batch of 3</button>
    </div>
  </section>

  <section class="card" id="results" aria-live="polite" hidden></section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const CLASSES = ["negative", "neutral", "positive"];

  fetch("/health")
    .then((r) => r.json())
    .then((h) => { $("model").textContent = `model ${h.model_version} · db ${h.db}`; })
    .catch(() => { $("model").textContent = "API unreachable"; });

  document.querySelectorAll(".chip").forEach((b) =>
    b.addEventListener("click", () => { $("reviews").value = b.dataset.text; analyze(); }));
  $("analyze").addEventListener("click", analyze);
  $("reviews").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) analyze();
  });

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;  // textContent, never innerHTML: review text is user input
    return e;
  }

  async function analyze() {
    const texts = $("reviews").value.split("\n").map((t) => t.trim()).filter(Boolean);
    if (!texts.length) return;
    const single = texts.length === 1;
    const out = $("results");
    $("analyze").disabled = true;
    try {
      const res = await fetch(single ? "/predict" : "/predict/batch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(single ? { text: texts[0] } : { texts }),
      });
      const data = await res.json();
      out.replaceChildren();
      if (!res.ok) {
        out.append(el("p", "error", data.error?.message || `Request failed (${res.status})`));
      } else {
        (single ? [data] : data.predictions).forEach((p, i) => out.append(renderResult(texts[i], p)));
      }
    } catch {
      out.replaceChildren(el("p", "error", "Could not reach the API."));
    } finally {
      out.hidden = false;
      $("analyze").disabled = false;
    }
  }

  function renderResult(text, p) {
    const box = el("div", "result");
    const head = el("div");
    const label = el("span", "label", p.label);
    label.style.color = `var(--${p.label})`;
    head.append(label, el("span", "hint", `${(p.confidence * 100).toFixed(1)}% confidence`));
    box.append(head, el("div", "text", text));
    for (const c of CLASSES) {
      const pct = (p.probabilities[c] || 0) * 100;
      const fill = el("div", "fill");
      fill.style.width = `${pct}%`;
      fill.style.background = `var(--${c})`;
      const track = el("div", "track");
      track.append(fill);
      const row = el("div", "bar");
      row.append(el("span", null, c), track, el("span", "hint", `${pct.toFixed(1)}%`));
      box.append(row);
    }
    return box;
  }
</script>
</body>
</html>
