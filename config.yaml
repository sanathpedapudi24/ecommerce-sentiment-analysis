seed: 42

data:
  raw_path: "data/raw/reviews.csv"
  processed_dir: "data/processed"
  split_ids_path: "data/processed/split_ids.json"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

database:
  url: "sqlite:///data/sentiment.db"
  db_path: "data/sentiment.db"

model:
  version: "v1.1.0"
  models_dir: "models"
  active_version: "v1.1.0"

features:
  ngram_range: [1, 2]
  min_df: 3
  max_df: 0.9
  sublinear_tf: true
  max_features: 50000

api:
  host: "127.0.0.1"
  port: 5000
  max_batch_size: 100
  max_char_length: 5000
  request_size_limit_bytes: 1048576

reports:
  figures_dir: "reports/figures"
  exports_dir: "reports/exports"
  evaluation_path: "reports/evaluation.md"
  data_quality_path: "reports/data_quality.md"
  errors_path: "reports/errors.csv"
  themes_path: "reports/themes.md"
